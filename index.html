<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./js/app.js"></script>
    <link rel="stylesheet" href="./css/style.css"/>
    <title>Simon Game</title>
</head>
<body>
  <header>
    <h1 class="heading js-heading">Simon Game</h1>
  </header>
  <main class="game">
    <section class="tile-container container unclickable">
      <div class="tile tile-red" data-tile="red"></div>
      <div class="tile tile-green" data-tile="green"></div>
      <div class="tile tile-blue" data-tile="blue"></div>
      <div class="tile tile-yellow" data-tile="yellow"></div>
    </section>
  </main>
  <footer class="info-section">
    <button class="start-button">Start</button>
    <span class="info info hidden"></span>
  </footer>
    <div class="hidden">
      <audio
        src="https://s3.amazonaws.com/freecodecamp/simonSound1.mp3"
        data-sound="red">
      </audio>
      <audio
        src="https://s3.amazonaws.com/freecodecamp/simonSound2.mp3"
        data-sound="green">
      </audio>
      <audio
        src="https://s3.amazonaws.com/freecodecamp/simonSound3.mp3"
        data-sound="blue">
      </audio>
      <audio
        src="https://s3.amazonaws.com/freecodecamp/simonSound4.mp3"
        data-sound="yellow">
      </audio>
      </div>  
</body>
</html>
